# Stack configuration for orca-agent-team.
#
# Copy this file to config/stack.yaml and edit it for your stack. No YAML parser reads it locally: a chat
# validates it and writes a shell-sourceable env file per team, ~/.local/share/<stack.id>/stack.env for the default
# one, that the bootstrap, the checklists and the monitors in tools/ read (tools/README.md, "Writing the env file").
#
# This example describes a fictional stack named "acme": one hub repository, one frontend and one backend.
# Every value below is an example. Replace it with your own.

stack:
  # Short identifier of the stack. Lowercase letters, digits and hyphens only ([a-z0-9-]+).
  # It names the team's one local-share tree, ~/.local/share/<id>/: stack.env, ideas/ and tech-lead/ (the Run
  # id files of both chats; tech-lead/ also holds conventions.txt, generated from conventions: below), monitors/
  # (monitor state and logs) and bootstrap/ (the installing chat's files).
  id: acme
  # Display name, used in messages and documents.
  name: "ACME platform"

# Every repository of the stack. Each entry needs all five keys.
#   name:        the repository's display name in Orca: the clone's folder name; the bootstrap reads it back
#                after registering it. Commands select a repository by path, so the name is for display
#   path:        the local clone; a leading ~ is expanded to your home directory
#   remote:      the GitHub repository as owner/repo; the PR monitor polls it
#   main_branch: the branch features finally land on (main here; some teams use develop)
#   kind:        one of hub | frontend | backend | docs | infra | other
# Exactly one repository has kind hub: the Ideas and Tech-lead chats live in it, and it keeps the planning
# documents (see hub: below). The other kinds select which worker role card applies to a repository.
repos:
  - name: acme-hub
    path: ~/src/acme/acme-hub
    remote: acme-org/acme-hub
    main_branch: main
    kind: hub
  - { name: acme-web, path: ~/src/acme/acme-web, remote: acme-org/acme-web, main_branch: main, kind: frontend }
  - { name: acme-api, path: ~/src/acme/acme-api, remote: acme-org/acme-api, main_branch: main, kind: backend }

# Where the hub repository keeps its planning documents, as paths relative to the hub's local clone.
# These are defaults; change them freely to wherever your hub keeps them. Every key is optional.
hub:
  # Product requirement documents, one file per feature.
  prds_dir: docs/prd
  # Architecture and product decision records.
  decisions_dir: docs/decisions
  # The backlog file.
  backlog_file: BACKLOG.md

# The template's default workflow. Every key is optional; the values below are the defaults.
delivery:
  # Work-unit pull requests go into one integration branch per feature; the integration branch then goes to
  # the main branch in one pull request.
  integration_branch_per_feature: true
  # Only the product owner merges into the main branch, after testing.
  owner_merges_main: true

# Free-form team rules the Tech-lead passes into every brief. A new project starts with none.
# One rule per entry, on one line. An entry also changes a template default (agents/README.md, "Template
# defaults"). Example entries that some teams use:
#   - "Feature flags gate every new module."
#   - "The Tech-lead opens every integration PR ready for review, not as a draft."
#   - "A new library, pattern or shared layer needs a written Tech-lead decision first; the reviewer blocks it."
#   - "A PR body that does not follow the repository's PR template is a review blocker."
#   - "A worker blocked for more than 30 minutes on the same thing asks the Tech-lead."
conventions: []

# Shared memory (Engram MCP).
memory:
  # Engram project key every chat and worker of the stack reads and writes.
  engram_project: acme-hub
  # Prefix of every topic key. The layout <prefix>/<domain>/<topic> is a default; change it.
  topic_prefix: acme

# Languages, as language codes or names the agents understand. Any language works; the example uses en.
language:
  # Language the Ideas and Tech-lead chats use with the product owner.
  owner_conversation: en
  # Language of code, docs, pull requests and commit messages.
  artifacts: en
  # Language of UI strings and user manuals.
  app_copy: en
  # Free-form rules every writer of app copy applies. Optional; an empty list is fine.
  # The entry below is only an illustration.
  app_copy_rules:
    - "Short sentences in the active voice."

# Model id and effort level per role and per worker seniority, as Claude Code accepts them
# (claude --model <id> --effort <level>). Effort is one of low | medium | high | xhigh | max.
# All five entries are required.
models:
  ideas:     { model: claude-opus-5-5,   effort: high }
  tech_lead: { model: claude-opus-5-5,   effort: high }
  senior:    { model: claude-opus-5-5,   effort: high }
  mid:       { model: claude-sonnet-5-5, effort: medium }
  junior:    { model: claude-haiku-5-5,  effort: low }

# Optional workers on other Orca agents (docs/providers.md). Absent or [] means Claude only: every worker is
# Claude, with models.<seniority> above. Each entry needs all three keys.
#   agent: the Orca agent id passed to worker-start --agent; [a-z0-9-]+, not claude; no two entries share one
#   model: the model id passed to worker-start --model; "" when Orca cannot pass one to that agent (opencode2),
#          and the model then comes from the agent's own config
#   takes: the task kinds this provider may take, a non-empty list of:
#            explore     read-only exploration and mapping
#            docs-draft  draft documentation the Tech-lead or a Claude writer finalizes
#            mechanical  a small, pattern-following code change: rename, lint or format fix, a test that copies
#                        an existing pattern
# Fixed rules, not set here: Claude takes every kind and every unit not listed; a unit with a high-risk item never
# goes to a non-Claude worker; Claude reviews every non-Claude worker's output; a provider is used only after its
# smoke test passes. The two entries below are an illustrative default; replace them, or write providers: [].
providers:
  - agent: antigravity
    model: gemini-3.8-flash-medium
    takes: [explore, docs-draft]
  - agent: opencode2
    model: ""
    takes: [mechanical]

# The three Orca settings the setup expects. The human sets them by hand in the Orca settings UI, and the
# bootstrap asks the human to confirm them; the env file records them for the chats to read.
orca:
  # Chat UI ON: both chats run as Orca chats.
  chat_ui: true
  # Agent sleep OFF: mail does not wake a slept agent, so a slept coordinator would miss its mailbox.
  agent_sleep: false
  # Agent Dashboard ON: recommended for the human who watches the team.
  agent_dashboard: true

# The two long-lived monitors in tools/. Both post to the mailbox of the Tech-lead's Orca Run.
# Every key is optional; the values below are the defaults.
monitors:
  # Seconds between two polls of the PR monitor.
  pr_interval_seconds: 300
  # Seconds between two ticks of the worker permission watch.
  watch_interval_seconds: 20
  # gh pr list --author filter: "@me" is the account gh is logged in with.
  pr_author: "@me"
  # A merged pull request stays in the PR monitor's snapshot for this many days.
  merged_window_days: 2
