name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck and the example config
    runs-on: ubuntu-24.04
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      YQ_VERSION: v4.54.1
      YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck and yq
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/bin/"
          curl -fsSL -o "$RUNNER_TEMP/bin/yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $RUNNER_TEMP/bin/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: bash -n
        run: for f in tools/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck tools/*.sh
      - name: Check the example config
        shell: bash
        run: |
          f=config/stack.example.yaml
          yq -e '.' "$f" >/dev/null
          test "$(yq '[.repos[] | select(.kind == "hub")] | length' "$f")" -eq 1
          yq -e '(.repos | length) > 0 and (.repos | all_c(.name != null and .path != null and .remote != null and .main_branch != null and .kind != null))' "$f" >/dev/null
          for k in stack.id stack.name hub.prds_dir hub.decisions_dir hub.backlog_file \
                   delivery.integration_branch_per_feature delivery.owner_merges_main conventions \
                   memory.engram_project memory.topic_prefix \
                   language.owner_conversation language.artifacts language.app_copy language.app_copy_rules \
                   models.{ideas,tech_lead,senior,mid,junior}.{model,effort} providers \
                   orca.chat_ui orca.agent_sleep orca.agent_dashboard \
                   monitors.pr_interval_seconds monitors.watch_interval_seconds monitors.pr_author monitors.merged_window_days; do
            yq -e ".$k != null" "$f" >/dev/null || { echo "missing key: $k"; exit 1; }
          done
          yq -e '(.providers | tag) == "!!seq" and (.providers | all_c(.agent != null and .model != null and (.takes | tag) == "!!seq" and (.takes | length) > 0))' "$f" >/dev/null \
            || { echo "providers: each entry needs agent, model and a non-empty takes list"; exit 1; }
          yq -e '[.providers[].takes[]] | all_c(. == "explore" or . == "docs-draft" or . == "mechanical")' "$f" >/dev/null \
            || { echo "providers[].takes: each value is one of explore, docs-draft, mechanical"; exit 1; }
      - name: Monitors print their help
        run: |
          tools/pr-monitor.sh --help
          tools/worker-watch.sh --help

  links:
    name: Markdown links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments --no-progress './**/*.md'
          token: ""
          jobSummary: false
          fail: true
